<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263b7a">
<title>Reserva Tu K</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f5fb;color:#292929;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:980px;margin:auto;min-height:100vh}
header{height:62px;background:#fff;border-bottom:1px solid #e2e2e8;display:flex;align-items:center;padding:7px 14px;gap:9px}
.logo{width:40px;height:40px}
.brand{font-size:17px;font-weight:850;color:#263b7a}
.sub{font-size:9px;color:#777}
.topbar{margin-left:auto;display:flex;gap:6px}
.smallbtn{border:1px solid #ddd;background:#fff;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:800;color:#263b7a}
.smallbtn.primary{background:#263b7a;color:#fff;border-color:#263b7a}
main{padding:12px 10px 82px}
h1{font-size:21px;color:#263b7a;margin:0 0 10px}
.card{background:#fff;border:1px solid #dedfe6;border-radius:11px;padding:10px;margin-bottom:9px}
.label{font-size:13px;font-weight:850;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:9px}
.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.month{font-size:13px;font-weight:850;color:#263b7a}
.arrow{width:28px;height:25px;border:0;border-radius:6px;background:#eef0f5;color:#263b7a;font-size:17px}
.arrow:disabled{opacity:.35}
.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.week{font-size:8px;color:#777;font-weight:800;text-align:center;margin-bottom:2px}
.day{height:29px;border:1px solid transparent;background:#fff;border-radius:6px;font-size:10px}
.day.selected{background:#263b7a;color:#fff;font-weight:800}
.day:disabled{color:#b9b9bd;background:#f1f1f3}
.loginbox{background:#fafaff;border-radius:9px;padding:9px}
input,select{width:100%;padding:8px;border:1px solid #d5d7dc;border-radius:7px;font-size:14px;margin:3px 0 7px;background:#fff}
label{font-size:10px;font-weight:700}
.btn{width:100%;border:0;border-radius:20px;padding:9px;background:#263b7a;color:#fff;font-size:12px;font-weight:850}
.btn:disabled{background:#b8d779}
.btn.secondary{background:#eef0f5;color:#263b7a}
.btn.danger{background:#b42318}
.btn.inline{width:auto;padding:7px 10px;border-radius:7px}
.msg{font-size:10px;color:#b42318;margin-top:5px}
.muted{font-size:10px;color:#777}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.time,.court{border:1px solid #cbe49a;background:#f0f9dc;color:#3c5d0b;border-radius:7px;padding:8px 4px;font-size:11px;font-weight:850}
.time.selected,.court.selected{background:#b8e53f;border-color:#b8e53f}
.busy{background:#eeeef1;color:#999;border-color:#e2e2e5}
.courts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.summary div{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:6px 0;font-size:11px}
.summary b{color:#263b7a}
.success{text-align:center;padding:20px 8px}
.check{margin:auto;width:50px;height:50px;border-radius:50%;background:#b8e53f;display:grid;place-items:center;font-size:26px;font-weight:900}
.success h2{color:#263b7a;font-size:19px}
.success p{font-size:12px;color:#666}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
.nav button{padding:10px;border:1px solid #ddd;background:#fff;border-radius:8px;color:#263b7a;font-weight:850}
.nav button.active{background:#263b7a;color:#fff}
.list{display:grid;gap:7px}
.item{border:1px solid #e0e0e5;border-radius:9px;padding:9px;background:#fff}
.itemhead{display:flex;justify-content:space-between;gap:7px}
.item strong{color:#263b7a}
.tag{font-size:9px;padding:3px 6px;border-radius:10px;background:#eef0f5}
.tag.busy{background:#eee}
.actions{display:flex;gap:5px;margin-top:7px}
.actions .btn{flex:1}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.admin-table{width:100%;border-collapse:collapse;font-size:10px}
.admin-table th,.admin-table td{padding:6px 4px;border-bottom:1px solid #eee;text-align:left}
.admin-table th{color:#263b7a}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:7px 10px;z-index:10}
.bottom .btn{max-width:960px;margin:auto;display:block}
.hidden{display:none!important}
.dangertext{color:#b42318}
.oktext{color:#3c5d0b}

@media(max-width:650px){
.grid2,.admin-grid{grid-template-columns:1fr}
.times{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:420px){
header{height:57px;padding:6px 10px}
.logo{width:36px;height:36px}
.brand{font-size:15px}
main{padding:10px 8px 78px}
h1{font-size:19px}
.times{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<script type="module">

from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig={

authDomain:"reserva-tu-k.firebaseapp.com",
projectId:"reserva-tu-k",
storageBucket:"reserva-tu-k.firebasestorage.app",

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const courts=["Cancha 1","Cancha 2"];

const times=[
"10:00","11:00","12:00",
"15:00","16:00","17:00",
"18:00","19:00","20:00"
];

const TEST_CLIENTS=[

{numeroCliente:"001",nombre:"Cliente de prueba 001",telefono:"",tipo:"socio",pin:"1234",estado:"activo",roles:["cliente"]},

{numeroCliente:"002",nombre:"Cliente de prueba 002",telefono:"",tipo:"socio",pin:"2345",estado:"activo",roles:["cliente"]},

{numeroCliente:"003",nombre:"Cliente de prueba 003",telefono:"",tipo:"externo",pin:"3456",estado:"activo",roles:["cliente"]},

{numeroCliente:"004",nombre:"Cliente de prueba 004",telefono:"",tipo:"socio",pin:"4567",estado:"activo",roles:["cliente"]},

{numeroCliente:"005",nombre:"Cliente de prueba 005",telefono:"",tipo:"externo",pin:"5678",estado:"activo",roles:["cliente"]},

{numeroCliente:"006",nombre:"Cliente de prueba 006",telefono:"",tipo:"socio",pin:"6789",estado:"activo",roles:["cliente"]},

{numeroCliente:"007",nombre:"Cliente de prueba 007",telefono:"",tipo:"externo",pin:"7890",estado:"activo",roles:["cliente"]},

{numeroCliente:"008",nombre:"Cliente de prueba 008",telefono:"",tipo:"socio",pin:"8901",estado:"activo",roles:["cliente"]},

{numeroCliente:"009",nombre:"Cliente de prueba 009",telefono:"",tipo:"externo",pin:"9012",estado:"activo",roles:["cliente"]},

{numeroCliente:"010",nombre:"Cliente de prueba 010",telefono:"",tipo:"socio",pin:"0123",estado:"activo",roles:["cliente"]},

{numeroCliente:"999",nombre:"Administrador de prueba",telefono:"",tipo:"socio",pin:"9999",estado:"activo",roles:["cliente","administrador"]}

];


let firebaseUser=null;
let current=null;
let view="login";
let clientSection="home";
let selectedDate=iso(today());
let selectedTime=null;
let selectedCourt=null;
let availability={};


function startOfDay(d){
let x=new Date(d);
x.setHours(0,0,0,0);
return x;
}

function today(){
return startOfDay(new Date());
}

function addDays(d,n){
let x=new Date(d);
x.setDate(x.getDate()+n);
return startOfDay(x);
}

function iso(d){
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function parseDate(s){
let [y,m,d]=s.split("-").map(Number);
return new Date(y,m-1,d);
}

function dt(date,time){
let [h,m]=time.split(":").map(Number);
let d=parseDate(date);
d.setHours(h,m,0,0);
return d;
}

function fmtDate(s){
return parseDate(s).toLocaleDateString(
"es-CL",
{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}
);
}

function fmtTimeRange(t){
let [h,m]=t.split(":").map(Number);
let d=new Date(2000,0,1,h,m);
let e=new Date(d.getTime()+3600000);
return `${t}–${String(e.getHours()).padStart(2,"0")}:${String(e.getMinutes()).padStart(2,"0")}`;
}

function esc(s){
return String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function clientWindow(){
return {
min:today(),
max:addDays(today(),6)
};
}

function clientBookable(s){
let d=parseDate(s);
let w=clientWindow();
return d>=w.min&&d<=w.max;
}

function slotOpen(s,t){
let now=new Date();
let start=dt(s,t);

if(s!==iso(now)) return true;

return now<new Date(start.getTime()+120000);
}

function hasStarted(r){
return r.startAt.toDate()<=new Date();
}


async function ensureAuth(){

if(auth.currentUser)
return auth.currentUser;

let c=await signInAnonymously(auth);

firebaseUser=c.user;

return c.user;
}


function savedSession(){

try{
return JSON.parse(
localStorage.getItem("rtk_session")||"null"
);
}
catch{
return null;
}

}

function saveSession(c){
localStorage.setItem(
"rtk_session",
JSON.stringify({
numeroCliente:c.numeroCliente
})
);
}

function clearSession(){
localStorage.removeItem("rtk_session");
}

function findClient(n){
return TEST_CLIENTS.find(
c=>c.numeroCliente===String(n).padStart(3,"0")
);
}


function topbar(){

let el=document.getElementById("topbar");

if(!current){
el.innerHTML="";
return;
}

el.innerHTML=
`<button class="smallbtn" onclick="logout()">Cerrar sesión</button>`;

}


function doLogin(){

let n=document.getElementById("loginNumber").value.trim();
let pin=document.getElementById("loginPin").value.trim();
let msg=document.getElementById("loginMsg");

msg.textContent="";

let c=findClient(n);

if(!c || c.pin!==pin){

msg.textContent="N.º de Cliente o PIN incorrecto.";
return;

}

if(c.estado!=="activo"){

msg.textContent="Cliente inactivo.";
return;

}

current=c;

saveSession(c);

topbar();

if(c.roles.includes("administrador")){

view="admin";
renderAdmin();

}else{

view="client";
clientSection="home";
renderClient();

}

}


function logout(){

clearSession();

current=null;

view="login";

clientSection="home";

signOut(auth).catch(()=>{});

topbar();

renderLogin();

}


function renderLogin(){

document.getElementById("appMain").innerHTML=`

</button>

</div>

</section>

MVP de prueba controlada.
</div>

</section>

`;

}


function renderClient(){

topbar();

document.getElementById("appMain").innerHTML=`

<h1>
Hola, ${esc(current.nombre)}
</h1>

<section class="card">

<div class="label">
N.º de Cliente: ${current.numeroCliente}
</div>

</div>

</section>

<div class="nav">

<button
class="${clientSection==="home"?"active":""}"
onclick="setClientSection('home')">

</button>

<button

Mis Reservas
</button>

</div>

<div id="clientContent"></div>

`;

if(clientSection==="mine")
renderMine();
else
renderBooking();

}


function setClientSection(s){

clientSection=s;

if(view!=="client")
return;

renderClient();

}


function renderBooking(){

let box=document.getElementById("clientContent");

box.innerHTML=`

<section class="card">

<div class="label">Fecha</div>

<div class="calendar-head">

<button class="arrow"
onclick="changeDay(-1)">‹</button>

<div class="month">
${fmtDate(selectedDate)}
</div>

<button class="arrow"
onclick="changeDay(1)">›</button>

</div>

<div class="calendar">

${Array.from({length:7},(_,i)=>{

let d=addDays(today(),i);
let s=iso(d);

return `

<button
class="day ${s===selectedDate?"selected":""}"
onclick="selectDate('${s}')">

${d.getDate()}

</button>

`;

}).join("")}

</div>

</section>

<section class="card">

<div class="label">
Selecciona horario
</div>

<div class="times">

${times.map(t=>{

let open=slotOpen(selectedDate,t);

return `

<button
class="time ${selectedTime===t?"selected":""} ${open?"":"busy"}"
${open?`onclick="selectTime('${t}')"`:"disabled"}>

${t}

</button>

`;

}).join("")}

</div>

</section>

<section class="card">

<div class="label">
Canchas disponibles
</div>

<div id="courtsBox" class="courts">

<div class="muted">
Selecciona una hora.
</div>

</div>

</section>

<section id="confirmCard" class="card hidden">

<div class="label">
Confirmar reserva
</div>

<div id="summary" class="summary"></div>

<button
class="btn"
onclick="confirmClientBooking()">

Confirmar reserva

</button>

<div id="bookingMsg" class="msg"></div>

</section>

`;

refreshAvailability();

}


async function changeDay(delta){

let currentD=parseDate(selectedDate);
let newD=addDays(currentD,delta);

if(!clientBookable(iso(newD)))
return;

selectedDate=iso(newD);
selectedTime=null;
selectedCourt=null;

renderBooking();

}


async function selectDate(s){

if(!clientBookable(s))
return;

selectedDate=s;
selectedTime=null;
selectedCourt=null;

renderBooking();

}


async function selectTime(t){

if(!slotOpen(selectedDate,t))
return;

selectedTime=t;
selectedCourt=null;

await refreshAvailability();

renderCourts();

}


async function refreshAvailability(){

availability={};

let q=query(
collection(db,"reservas"),
where("fecha","==",selectedDate)
);

try{

let snap=await getDocs(q);

snap.forEach(d=>{

let r=d.data();

if(r.estado==="cancelada")
return;

if(!availability[r.startAt.toDate()])
{}

let time=
`${String(r.startAt.toDate().getHours()).padStart(2,"0")}:${String(r.startAt.toDate().getMinutes()).padStart(2,"0")}`;

if(!availability[time])
availability[time]=[];

availability[time].push(r.cancha);

});

renderCourts();

}
catch(e){

console.error(e);

}

}


function renderCourts(){

let box=document.getElementById("courtsBox");

if(!box)
return;

if(!selectedTime){

box.innerHTML=
'<div class="muted">Selecciona una hora.</div>';

return;

}

box.innerHTML=courts.map(c=>{

let occupied=
availability[selectedTime]?.includes(c);

let free=!occupied;

return `

<button
class="court ${free?"":"busy"} ${c===selectedCourt?"selected":""}"
${free?`onclick="selectCourt('${c}')`:"disabled"}>

${c} · ${free?"DISPONIBLE":"OCUPADA"}

</button>

`;

}).join("");

let card=document.getElementById("confirmCard");

if(card){

card.classList.toggle(
"hidden",
!selectedCourt
);

if(selectedCourt){

document.getElementById("summary").innerHTML=`

<div>
<span>Cliente</span>
<b>${esc(current.nombre)}</b>
</div>

<div>
<span>Fecha</span>
<b>${esc(fmtDate(selectedDate))}</b>
</div>

<div>
<span>Horario</span>
<b>${fmtTimeRange(selectedTime)}</b>
</div>

<div>
<span>Cancha</span>
<b>${selectedCourt}</b>
</div>

`;

}

}

}


function selectCourt(c){

selectedCourt=c;

renderCourts();

}


async function getOwnReservations(){

let q=query(
collection(db,"reservas"),
where("clienteId","==",current.numeroCliente)
);

let snap=await getDocs(q);

let arr=[];

snap.forEach(d=>{

arr.push({
id:d.id,
...d.data()
});

});

return arr
.filter(r=>
r.estado!=="cancelada" &&
r.startAt &&
r.startAt.toDate()>=startOfDay(new Date())
)
.sort(
(a,b)=>
a.startAt.toMillis()-b.startAt.toMillis()
);

}


async function renderMine(){

let box=document.getElementById("clientContent");

box.innerHTML=`

<section class="card">

<div class="label">
Mis Reservas
</div>

<div class="muted">
Consultando...
</div>

</section>

`;

let arr=await getOwnReservations();

if(!arr.length){

box.innerHTML=`

<section class="card">

<div class="label">
Mis Reservas
</div>

<div class="muted">
No tienes reservas vigentes.
</div>

</section>

`;

return;

}

box.innerHTML=`

<section class="card">

<div class="label">
Mis Reservas
</div>

<div class="list">

${arr.map(r=>{

let started=hasStarted(r);

let d=r.startAt.toDate();

let time=
`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;

return `

<div class="item">

<div class="itemhead">

<strong>
${esc(fmtDate(iso(d)))} · ${r.cancha}
</strong>

<span class="tag">
${fmtTimeRange(time)}
</span>

</div>

<div class="actions">

<button
class="btn danger"
${started?"disabled":""}
onclick="cancelOwn('${r.id}')">

Cancelar

</button>

</div>

</div>

`;

}).join("")}

</div>

</section>

`;

}


async function cancelOwn(id){

if(!confirm("¿Quieres cancelar esta reserva?"))
return;

let ref=doc(db,"reservas",id);

let snap=await getDoc(ref);

if(!snap.exists())
return;

let r=snap.data();

if(
r.clienteId!==current.numeroCliente ||
hasStarted(r)
){

alert("La reserva ya no puede ser cancelada.");
return;

}

await updateDoc(ref,{

estado:"cancelada",
updatedAt:Timestamp.now(),
updatedBy:current.numeroCliente

});

alert("Reserva cancelada");

renderMine();

}


function clientActiveReservations(arr){

return arr.filter(
r=>
r.estado!=="cancelada" &&
r.startAt.toDate()>new Date()
);

}


async function confirmClientBooking(){

let msg=document.getElementById("bookingMsg");

msg.textContent="";

if(!selectedCourt || !selectedTime)
return;

if(
!clientBookable(selectedDate) ||
!slotOpen(selectedDate,selectedTime)
){

msg.textContent=
"La fecha u hora ya no está disponible.";

return;

}

let all=await getOwnReservations();

let active=clientActiveReservations(all);

if(active.length>=2){

msg.textContent=
"Ya tienes 2 reservas vigentes.";

return;

}

if(active.some(r=>{

let t=r.startAt.toDate();

return
iso(t)===selectedDate &&
`${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`===selectedTime;

})){

msg.textContent=
"No puedes tener dos reservas en el mismo horario.";

return;

}

let newStart=dt(selectedDate,selectedTime);

if(active.some(r=>
Math.abs(
r.startAt.toDate().getTime()-
newStart.getTime()
)===3600000
)){

msg.textContent=
"No puedes realizar reservas consecutivas.";

return;

}

try{

await ensureAuth();

let id=
`${selectedDate}_${selectedTime.replace(":","-")}_${selectedCourt.replace(" ","-")}`;

let ref=doc(db,"reservas",id);

let startAt=Timestamp.fromDate(newStart);

await runTransaction(db,async(tx)=>{

let existing=await tx.get(ref);

if(
existing.exists() &&
existing.data().estado!=="cancelada"
)
throw new Error("SLOT_ALREADY_RESERVED");

tx.set(ref,{

clienteId:current.numeroCliente,
nombreCliente:current.nombre,
tipoCliente:current.tipo,
fecha:selectedDate,
startAt,
cancha:selectedCourt,
estado:"confirmada",
createdAt:Timestamp.now(),
createdBy:current.numeroCliente

});

});

showSuccess();

}
catch(e){

console.error(e);

if(e.message==="SLOT_ALREADY_RESERVED"){

msg.textContent=
"La cancha acaba de ser reservada. Por favor, selecciona otra cancha u horario.";

}
else{

msg.textContent=
"No fue posible confirmar la reserva.";

}

await refreshAvailability();

}

}

async function loadAdminDay(){

let s=document.getElementById("adminDate").value;

if(!s)
return;

let box=document.getElementById("adminDay");

box.innerHTML=
'<div class="muted">Consultando...</div>';

let q=query(
collection(db,"reservas"),
where("fecha","==",s)
);

let snap=await getDocs(q);

let rows=[];

snap.forEach(d=>{

let r=d.data();

if(r.estado!=="cancelada")
rows.push({
id:d.id,
...r
});

});

rows.sort(
(a,b)=>
a.startAt.toMillis()-b.startAt.toMillis()
);

box.innerHTML=times.map(t=>{

let tr=rows.filter(r=>{

let d=r.startAt.toDate();

return
`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`===t;

});

return `

<div
class="item"
style="margin-bottom:5px">

<strong>${t}</strong>

<div
class="admin-grid"
style="margin-top:4px">

${courts.map(c=>{

let r=tr.find(x=>x.cancha===c);

return `

<div>

<span
class="tag ${r?"busy":""}">

${c} · ${r?"OCUPADA":"DISPONIBLE"}

</span>

${r?

`<div class="muted">
${esc(r.nombreCliente)} · N.º ${r.clienteId}
<br>
<button
class="smallbtn"
onclick="adminCancel('${r.id}')">

Cancelar

</button>
</div>`

:""}

</div>

`;

}).join("")}

</div>

</div>

`;

}).join("");

}


async function adminCreateReservation(){

let n=
document.getElementById("adminClient")
.value.trim()
.padStart(3,"0");

let s=
document.getElementById("adminDate").value;

let t=
document.getElementById("adminTime").value;

let court=
document.getElementById("adminCourt").value;

let msg=
document.getElementById("adminMsg");

msg.textContent="";

let client=findClient(n);

if(!client || client.estado!=="activo"){

msg.textContent=
"Cliente no encontrado o inactivo.";

return;

}

let start=dt(s,t);

if(start<=new Date()){

msg.textContent=
"La reserva debe ser futura.";

return;

}

try{

let id=
`${s}_${t.replace(":","-")}_${court.replace(" ","-")}`;

let ref=doc(db,"reservas",id);

await runTransaction(db,async(tx)=>{

let ex=await tx.get(ref);

if(
ex.exists() &&
ex.data().estado!=="cancelada"
)
throw new Error("SLOT_ALREADY_RESERVED");

tx.set(ref,{

clienteId:n,
nombreCliente:client.nombre,
tipoCliente:client.tipo,
fecha:s,
startAt:Timestamp.fromDate(start),
cancha:court,
estado:"confirmada",
createdAt:Timestamp.now(),
createdBy:current.numeroCliente

});

});

msg.className="msg oktext";
msg.textContent="Reserva creada.";

loadAdminDay();

}
catch(e){

msg.className="msg";

msg.textContent=
e.message==="SLOT_ALREADY_RESERVED"
?"La cancha ya está ocupada."
:"No fue posible crear la reserva.";

}

}


async function adminCancel(id){

let snap=
await getDoc(doc(db,"reservas",id));

if(!snap.exists())
return;

let r=snap.data();

if(hasStarted(r)){

alert(
"La reserva ya comenzó y no puede anularse."
);

return;

}

if(!confirm("¿Cancelar esta reserva?"))
return;

await updateDoc(
doc(db,"reservas",id),
{
estado:"cancelada",
updatedAt:Timestamp.now(),
updatedBy:current.numeroCliente
}
);

loadAdminDay();

}
