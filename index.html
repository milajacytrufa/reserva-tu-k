async function initFirebase(){

  const authMod=await import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js");

  initializeApp=appMod.initializeApp;
  getAuth=authMod.getAuth;
  signInAnonymously=authMod.signInAnonymously;
  onAuthStateChanged=authMod.onAuthStateChanged;
  signOut=authMod.signOut;
  getFirestore=fsMod.getFirestore;
  collection=fsMod.collection;
  doc=fsMod.doc;

  getDocs=fsMod.getDocs;

}

function startOfDay(d){let x=new Date(d);x.setHours(0,0,0,0);return x} function today(){return startOfDay(new Date())} function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return startOfDay(x)} function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`} function parseDate(s){let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)} function dt(date,time){let [h,m]=time.split(":").map(Number),d=parseDate(date);d.setHours(h,m,0,0);return d} function fmtDate(s){return parseDate(s).toLocaleDateString("es-CL",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})} function fmtTimeRange(t){let [h,m]=t.split(":").map(Number),d=new Date(2000,0,1,h,m);let e=new Date(d.getTime()+3600000);return `${t}–${String(e.getHours()).padStart(2,"0")}:${String(e.getMinutes()).padStart(2,"0")}`} function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function clientWindow(){return {min:today(),max:addDays(today(),6)}} function clientBookable(s){let d=parseDate(s),w=clientWindow();return d>=w.min&&d<=w.max} function slotOpen(s,t){let now=new Date(),start=dt(s,t);return s!==iso(now)||now<new Date(start.getTime()+120000)} function isFutureReservation(r){return r.startAt.toDate()>new Date()} function hasStarted(r){return r.startAt.toDate()<=new Date()}
async function ensureAuth(){
  await initFirebase();
  if(auth.currentUser)return auth.currentUser;
  let c=await signInAnonymously(auth);
  firebaseUser=c.user;
  return c.user;
}
function savedSession(){try{return JSON.parse(localStorage.getItem("rtk_session")||"null")}catch{return null}}
function saveSession(c){localStorage.setItem("rtk_session",JSON.stringify({numeroCliente:c.numeroCliente}))} function clearSession(){localStorage.removeItem("rtk_session")}
function findClient(n){return TEST_CLIENTS.find(c=>c.numeroCliente===String(n).padStart(3,"0"))}
function topbar(){let el=document.getElementById("topbar");if(!current){el.innerHTML="";return} el.innerHTML=`<button class="smallbtn" onclick="logout()">Cerrar sesión</button>`}
function loginScreen(msg=""){document.getElementById("appMain").innerHTML=`<section class="card" style="max-width:430px;margin:30px auto"><h1>Ingresar</h1><div class="muted">N.º de Cliente + PIN de 4 dígitos</div><label>N.º de Cliente</label><input id="loginNum" inputmode="numeric" maxlength="3" placeholder="001"><label>PIN</label><input id="loginPin" type="password" inputmode="numeric" maxlength="4" placeholder="1234"><button class="btn" onclick="doLogin()">Ingresar</button><div class="msg">${esc(msg)}</div><div class="muted" style="margin-top:10px">MVP de prueba controlada.</div></section>`;topbar()}
async function doLogin(){
  let n=document.getElementById("loginNum").value.trim(),p=document.getElementById("loginPin").value.trim();
  if(!/^\d{3}$/.test(n)||!/^[0-9]{4}$/.test(p)){
    loginScreen("Ingresa un N.º de Cliente de 3 dígitos y un PIN de 4 dígitos.");
    return;
  }
  let c=findClient(n);
  if(!c||c.pin!==p){
    loginScreen("N.º de Cliente o PIN incorrecto.");
    return;
  }
  if(c.estado!=="activo"){
    loginScreen("El Cliente está inactivo.");
    return;
  }
  try{
    await ensureAuth();
  }catch(e){
    console.error("Firebase Auth:",e);
    loginScreen("No se pudo conectar con Firebase. Revisa la autenticación anónima del proyecto.");
    return;
  }
  current={...c};
  saveSession(c);
  view=c.roles.includes("administrador")?"admin":"client";
  clientSection="home";
  topbar();
  render();
}
async function boot(){
  let s=savedSession();
  if(s){
    let c=findClient(s.numeroCliente);
    if(c&&c.estado==="activo"){
      current={...c};
      view=c.roles.includes("administrador")?"admin":"client";
    }else{
      clearSession();
    }
  }
  render();
  try{
    await ensureAuth();
    if(current) render();
  }catch(e){
    console.error("Firebase Auth:",e);
  }
}
async function logout(){clearSession();current=null;clientSection="home";view="login";try{await signOut(auth);await ensureAuth()}catch{}render()}
function render(){topbar();if(!current){loginScreen();return}if(view==="admin")renderAdmin();else renderClient()}
function navClient(){return `<div class="nav"><button class="${clientSection==="home"?"active":""}" onclick="setClientSection('home')">Reservar Cancha</button><button class="${clientSection==="mine"?"active":""}" onclick="setClientSection('mine')">Mis Reservas</button></div>`}
function renderClient(){document.getElementById("appMain").innerHTML=`${navClient()}<div id="clientContent"></div>`;if(clientSection==="mine")renderMine();else renderHome();}
function setClientSection(s){clientSection=s;renderClient()}
function calendarHtml(){let d=parseDate(selectedDate),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),out="";for(let i=0;i<start;i++)out+="<div></div>";for(let n=1;n<=days;n++){let x=new Date(y,m,n),s=iso(x),ok=clientBookable(s);out+=`<button class="day ${s===selectedDate?"selected":""}" ${ok?`onclick="selectDate('${s}')"`:"disabled"}>${n}</button>`}return out}
function renderHome(){let w=clientWindow();document.getElementById("clientContent").innerHTML=`<h1>Reserva de Cancha</h1><div class="grid2"><section class="card"><div class="label">Selecciona la fecha</div><div class="calendar-head"><span class="month">${parseDate(selectedDate).toLocaleDateString("es-CL",{month:"long",year:"numeric"}).toUpperCase()}</span></div><div class="week"><span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span><span>SÁB</span><span>DOM</span></div><div class="calendar">${calendarHtml()}</div><div class="muted" style="margin-top:6px">Disponible: ${fmtDate(iso(w.min))} a ${fmtDate(iso(w.max))}</div></section><section class="card"><div class="label">Cliente</div><div><strong>${esc(current.nombre)}</strong></div><div class="muted">N.º ${current.numeroCliente} · ${current.tipo==="socio"?"Socio":"Externo"}</div><div style="margin-top:8px" class="muted">Las reglas de reserva se aplican automáticamente.</div></section></div><section class="card"><div class="label">Selecciona una hora</div><div id="times" class="times"><div class="muted">Consultando disponibilidad...</div></div></section><section class="card"><div class="label">Selecciona una cancha</div><div id="courts" class="courts"><div class="muted">Selecciona una hora.</div></div></section><section class="card ${selectedCourt?"":"hidden"}" id="confirmCard"><div class="label">Confirma tu reserva</div><div id="summary" class="summary"></div><button class="btn" onclick="confirmClientBooking()">Confirmar reserva</button><div id="bookingMsg" class="msg"></div></section><section class="card hidden" id="successCard"></section>`;refreshAvailability()}
async function refreshAvailability(){let box=document.getElementById("times");if(!box)return;box.innerHTML='<div class="muted">Consultando disponibilidad...</div>';try{let q=query(collection(db,"reservas"),where("fecha","==",selectedDate));let snap=await getDocs(q),occupied={};snap.forEach(d=>{let r=d.data();if(r.estado!=="cancelada"&&r.startAt){let t=r.startAt.toDate(),k=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");occupied[k]??=[];if(!occupied[k].includes(r.cancha))occupied[k].push(r.cancha)}});availability={};times.forEach(t=>{availability[t]=courts.filter(c=>!(occupied[t]||[]).includes(c)).filter(()=>slotOpen(selectedDate,t))});renderTimes();renderCourts()}catch(e){console.error(e);box.innerHTML='<div class="msg">No fue posible consultar disponibilidad.</div>'}}
function renderTimes(){let box=document.getElementById("times");if(!box)return;let arr=times.filter(t=>availability[t]?.length);box.innerHTML=arr.length?arr.map(t=>`<button class="time ${t===selectedTime?"selected":""}" onclick="selectTime('${t}')">${t}<small>${availability[t].length} ${availability[t].length===1?"cancha":"canchas"}</small></button>`).join(""):'<div class="muted">Sin disponibilidad.</div>'}
function selectDate(s){selectedDate=s;selectedTime=null;selectedCourt=null;renderHome()}
async function selectTime(t){
  if(!times.includes(t))return;
  if(!slotOpen(selectedDate,t)){
    await refreshAvailability();
    return;
  }
  selectedTime=t;
  selectedCourt=null;
  renderTimes();
  renderCourts();
  const card=document.getElementById("confirmCard");
  if(card)card.classList.add("hidden");
}
function renderCourts(){
  const box=document.getElementById("courts");
  if(!box)return;
  if(!selectedTime){
    box.innerHTML='<div class="muted">Selecciona una hora.</div>';
    return;
  }
  const available=availability[selectedTime]||[];
  box.innerHTML=courts.map(c=>{
    const free=available.includes(c);
    return `<button type="button" class="court ${free?"":"busy"} ${c===selectedCourt?"selected":""}" ${free?`onclick="selectCourt('${c}')"`:"disabled"}>${c} · ${free?"DISPONIBLE":"OCUPADA"}</button>`;
  }).join("");
  const card=document.getElementById("confirmCard");
  if(card){
    card.classList.toggle("hidden",!selectedCourt);
    if(selectedCourt){
      document.getElementById("summary").innerHTML=`<div><span>Cliente</span><b>${esc(current.nombre)}</b></div><div><span>Fecha</span><b>${esc(fmtDate(selectedDate))}</b></div><div><span>Horario</span><b>${fmtTimeRange(selectedTime)}</b></div><div><span>Cancha</span><b>${selectedCourt}</b></div>`;
    }
  }
}
function selectCourt(c){selectedCourt=c;renderCourts()}
async function getOwnReservations(){let q=query(collection(db,"reservas"),where("clienteId","==",current.numeroCliente));let snap=await getDocs(q),arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));return arr.filter(r=>r.estado!=="cancelada"&&r.startAt&&r.startAt.toDate()>=startOfDay(new Date())).sort((a,b)=>a.startAt.toMillis()-b.startAt.toMillis())}
async function renderMine(){let box=document.getElementById("clientContent");box.innerHTML='<section class="card"><div class="label">Mis Reservas</div><div class="muted">Consultando...</div></section>';let arr=await getOwnReservations();if(!arr.length){box.innerHTML='<section class="card"><div class="label">Mis Reservas</div><div class="muted">No tienes reservas vigentes.</div></section>';return}box.innerHTML=`<section class="card"><div class="label">Mis Reservas</div><div class="list">${arr.map(r=>{let started=hasStarted(r);return `<div class="item"><div class="itemhead"><strong>${esc(fmtDate(iso(r.startAt.toDate())))} · ${r.cancha}</strong><span class="tag">${fmtTimeRange(String(r.startAt.toDate().getHours()).padStart(2,"0")+":"+String(r.startAt.toDate().getMinutes()).padStart(2,"0"))}</span></div><div class="actions"><button class="btn danger" ${started?"disabled":""} onclick="cancelOwn('${r.id}')">Cancelar</button></div></div>`}).join("")}</div></section>`}
async function cancelOwn(id){if(!confirm("¿Quieres cancelar esta reserva?"))return;let ref=doc(db,"reservas",id),snap=await getDoc(ref);if(!snap.exists())return;let r=snap.data();if(r.clienteId!==current.numeroCliente||hasStarted(r)){alert("La reserva ya no puede ser cancelada.");return}await updateDoc(ref,{estado:"cancelada",updatedAt:Timestamp.now(),updatedBy:current.numeroCliente});alert("Reserva cancelada");renderMine()}
function clientActiveReservations(arr){return arr.filter(r=>r.estado!=="cancelada"&&r.startAt.toDate()>new Date())}
async function confirmClientBooking(){let msg=document.getElementById("bookingMsg");msg.textContent="";if(!selectedCourt||!selectedTime)return;if(!clientBookable(selectedDate)||!slotOpen(selectedDate,selectedTime)){msg.textContent="La fecha u hora ya no está disponible.";return}let all=await getOwnReservations(),active=clientActiveReservations(all);if(active.length>=2){msg.textContent="Ya tienes 2 reservas vigentes.";return}if(active.some(r=>{let t=r.startAt.toDate();return iso(t)===selectedDate&&String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")===selectedTime})){msg.textContent="No puedes tener dos reservas en el mismo horario.";return}let newStart=dt(selectedDate,selectedTime);if(active.some(r=>Math.abs(r.startAt.toDate().getTime()-newStart.getTime())===3600000)){msg.textContent="No puedes realizar reservas consecutivas.";return}try{await ensureAuth();let id=`${selectedDate}_${selectedTime.replace(":","-")}_${selectedCourt.replace(" ","-")}`,ref=doc(db,"reservas",id),startAt=Timestamp.fromDate(newStart);await runTransaction(db,async(tx)=>{let existing=await tx.get(ref);if(existing.exists()&&existing.data().estado!=="cancelada")throw new Error("SLOT_ALREADY_RESERVED");tx.set(ref,{clienteId:current.numeroCliente,nombreCliente:current.nombre,tipoCliente:current.tipo,fecha:selectedDate,startAt,cancha:selectedCourt,estado:"confirmada",createdAt:Timestamp.now(),createdBy:current.numeroCliente})});showSuccess()}catch(e){console.error(e);if(e.message==="SLOT_ALREADY_RESERVED")msg.textContent="La cancha acaba de ser reservada. Por favor, selecciona otra cancha u horario.";else msg.textContent="No fue posible confirmar la reserva.";await refreshAvailability()}}
function showSuccess(){document.getElementById("clientContent").innerHTML=`<section class="card success"><div class="check">✓</div><h2>Reserva confirmada</h2><p><b>Cliente:</b> ${esc(current.nombre)}</p><p><b>Fecha:</b> ${esc(fmtDate(selectedDate))}</p><p><b>Cancha:</b> ${selectedCourt}</p><p><b>Horario:</b> ${fmtTimeRange(selectedTime)}</p><p><b>Recuerda presentarte 10 min antes del inicio.</b></p><button class="btn" onclick="setClientSection('mine')">Ir a Mis Reservas</button></section>`}
function adminNav(){return `<div class="nav"><button class="active">Panel Administrador</button><button onclick="showAdminClients()">Clientes</button></div>`}
function renderAdmin(){document.getElementById("appMain").innerHTML=`${adminNav()}<h1>Panel de Administrador</h1><section class="card"><div class="label">Disponibilidad y reservas</div><div class="admin-grid"><div><label>Fecha</label><input id="adminDate" type="date" value="${iso(today())}" min="${iso(today())}"></div><div style="display:flex;align-items:end"><button class="btn" onclick="loadAdminDay()">Ver fecha</button></div></div><div id="adminDay" style="margin-top:8px"></div></section><section class="card"><div class="label">Nueva Reserva</div><div class="admin-grid"><div><label>N.º Cliente</label><input id="adminClient" inputmode="numeric" maxlength="3" placeholder="001"></div><div><label>Hora</label><select id="adminTime">${times.map(t=>`<option>${t}</option>`).join("")}</select></div><div><label>Cancha</label><select id="adminCourt">${courts.map(c=>`<option>${c}</option>`).join("")}</select></div><div style="display:flex;align-items:end"><button class="btn" onclick="adminCreateReservation()">Crear reserva</button></div></div><div id="adminMsg" class="msg"></div></section>`;loadAdminDay()}
async function loadAdminDay(){let s=document.getElementById("adminDate").value;if(!s)return;let box=document.getElementById("adminDay");box.innerHTML='<div class="muted">Consultando...</div>';let q=query(collection(db,"reservas"),where("fecha","==",s));let snap=await getDocs(q),rows=[];snap.forEach(d=>{let r=d.data();if(r.estado!=="cancelada")rows.push({id:d.id,...r})});rows.sort((a,b)=>a.startAt.toMillis()-b.startAt.toMillis());box.innerHTML=times.map(t=>{let tr=rows.filter(r=>{let d=r.startAt.toDate();return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`===t});return `<div class="item" style="margin-bottom:5px"><strong>${t}</strong><div class="admin-grid" style="margin-top:4px">${courts.map(c=>{let r=tr.find(x=>x.cancha===c);return `<div><span class="tag ${r?"busy":""}">${c} · ${r?"OCUPADA":"DISPONIBLE"}</span>${r?`<div class="muted">${esc(r.nombreCliente)} · N.º ${r.clienteId}<br><button class="smallbtn" onclick="adminCancel('${r.id}')">Cancelar</button></div>`:""}</div>`}).join("")}</div></div>`}).join("")}
async function adminCreateReservation(){let n=document.getElementById("adminClient").value.trim().padStart(3,"0"),s=document.getElementById("adminDate").value,t=document.getElementById("adminTime").value,court=document.getElementById("adminCourt").value,msg=document.getElementById("adminMsg");msg.textContent="";let client=findClient(n);if(!client||client.estado!=="activo"){msg.textContent="Cliente no encontrado o inactivo.";return}let start=dt(s,t);if(start<=new Date()){msg.textContent="La reserva debe ser futura.";return}try{let id=`${s}_${t.replace(":","-")}_${court.replace(" ","-")}`,ref=doc(db,"reservas",id);await runTransaction(db,async(tx)=>{let ex=await tx.get(ref);if(ex.exists()&&ex.data().estado!=="cancelada")throw new Error("SLOT_ALREADY_RESERVED");tx.set(ref,{clienteId:n,nombreCliente:client.nombre,tipoCliente:client.tipo,fecha:s,startAt:Timestamp.fromDate(start),cancha:court,estado:"confirmada",createdAt:Timestamp.now(),createdBy:current.numeroCliente})});msg.className="msg oktext";msg.textContent="Reserva creada.";loadAdminDay()}catch(e){msg.className="msg";msg.textContent=e.message==="SLOT_ALREADY_RESERVED"?"La cancha ya está ocupada.":"No fue posible crear la reserva."}}
async function adminCancel(id){let snap=await getDoc(doc(db,"reservas",id));if(!snap.exists())return;let r=snap.data();if(hasStarted(r)){alert("La reserva ya comenzó y no puede anularse.");return}if(!confirm("¿Cancelar esta reserva?"))return;await updateDoc(doc(db,"reservas",id),{estado:"cancelada",updatedAt:Timestamp.now(),updatedBy:current.numeroCliente});loadAdminDay()}
function showAdminClients(){document.getElementById("appMain").innerHTML=`${adminNav()}<h1>Clientes</h1><section class="card"><div class="label">Clientes de prueba</div><table class="admin-table"><thead><tr><th>N.º</th><th>Nombre</th><th>Tipo</th><th>Estado</th><th>Rol</th></tr></thead><tbody>${TEST_CLIENTS.map(c=>`<tr><td>${c.numeroCliente}</td><td>${esc(c.nombre)}</td><td>${c.tipo}</td><td>${c.estado}</td><td>${c.roles.join(" + ")}</td></tr>`).join("")}</tbody></table><div class="muted" style="margin-top:8px">En esta versión A, las 10 cuentas de prueba están preconfiguradas en la aplicación. La gestión completa de clientes se implementará en la etapa de autenticación definitiva.</div></section>`}
window.doLogin=doLogin;window.logout=logout;window.setClientSection=setClientSection;window.selectDate=selectDate;window.selectTime=selectTime;window.selectCourt=selectCourt;window.confirmClientBooking=confirmClientBooking;window.cancelOwn=cancelOwn;window.showAdminClients=showAdminClients;window.loadAdminDay=loadAdminDay;window.adminCreateReservation=adminCreateReservation;window.adminCancel=adminCancel;
boot();
</script>
